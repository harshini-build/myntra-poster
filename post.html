<!DOCTYPE html>
<html>
<head>
<title>Myntra Poster</title>
<style>
body { background: #f5f5f6; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.poster { background: white; width: 350px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
.header { background: #ff3f6c; color: white; padding: 15px; font-size: 22px; font-weight: bold; letter-spacing: 2px; }
.sale { padding: 30px 20px; }
.sale h1 { font-size: 45px; margin: 0; color: #282c3f; }
.sale h2 { color: #ff3f6c; font-size: 28px; margin: 10px 0; }
.sale p { color: #535766; }
.btn { background: #ff3f6c; color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 5px; cursor: pointer; margin-top: 15px; font-weight: bold; }
.footer { background: #282c3f; color: white; padding: 10px; font-size: 12px; }
</style>
</head>
<body>
<div class="poster">
  <div class="header">MYNTRA</div>
  <div class="sale">
    <h1>BIG FASHION</h1>
    <h2>FESTIVAL</h2>
    <p>50% - 80% OFF on Top Brands</p>
    <p>+ Extra 10% Cashback</p>
    <button class="btn">SHOP NOW</button>
  </div>
  <div class="footer">Ends Soon | myntra.com</div>
</div>
</body>
</html>
